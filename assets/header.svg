<title id="t">asintiko — Dmitriy Kvasnikov</title>
<desc id="d">Software developer and cybersecurity. First place at School 21 CTF and at the CyberSecurity Uzum Hackathon, 74th of 1000 solo at the CTF Cup of Russia. Tashkent, Uzbekistan.</desc>
<style>

  .mono { font: 500 19px ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; letter-spacing: 0.08em; fill: #8f8a85; }
  .mono b { fill: #f2ede6; }
  .hi { fill: #f2ede6; }
  .px { fill: #f2ede6; opacity: 0.14; animation: reveal 0.5s linear both, glint 10.0s linear infinite; }
  .lock { fill: none; stroke: #dc0812; stroke-width: 2; stroke-dasharray: 26; stroke-dashoffset: 26; animation: draw 0.5s ease-out 2.735s forwards; }
  .red { fill: #dc0812; opacity: 0; animation: redin 0.2s steps(1) 2.485s forwards, pulse 2.4s ease-in-out 3.085s infinite; }
  .trail { fill: #dc0812; opacity: 0; animation: trailin 0.2s steps(1) forwards; }
  @keyframes reveal { 0% { opacity: 0.14; fill: #f2ede6; } 1% { opacity: 1; fill: #dc0812; } 55% { opacity: 1; fill: #dc0812; } 100% { opacity: 1; fill: #f2ede6; } }
  @keyframes glint { 0%, 3.2%, 100% { fill: #f2ede6; } 0.4% { fill: #dc0812; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes redin { to { opacity: 1; } }
  @keyframes trailin { to { opacity: var(--o); } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  @media (prefers-reduced-motion: reduce) {
    .px, .red { animation: none; opacity: 1; }
    .trail { animation: none; opacity: var(--o); }
    .lock { animation: none; stroke-dashoffset: 0; }
    .scan { display: none; }
  }

</style>
